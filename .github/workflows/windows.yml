name: Test and build Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test message processing
        run: python -m unittest discover -s tests -v
      - name: Install packaging tools
        run: python -m pip install -r requirements-build.txt
      - name: Build compass icon
        run: python scripts/make_icon.py
      - name: Test desktop interface
        run: python main.py --smoke-test
      - name: Package Windows application
        run: python scripts/build_windows.py
      - name: Test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist\NMEA-Workbench\NMEA-Workbench.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Packaged app timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged app failed: $($process.ExitCode)" }
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: NMEA-Workbench-Windows
          path: dist/NMEA-Workbench/
          retention-days: 30
